name: Databricks bundle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: databricks-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python files compile
        run: python -m py_compile notebooks/*.py agent/*.py app/app.py tests/*.py dashboard/build_dashboard.py
      - name: Unit tests (guardrails, scorer, agent loop)
        run: |
          pip install -q pytest pandas pyyaml "sqlglot>=25"
          pytest -q tests/test_agent.py
      - name: Dashboard JSON is up to date with its generator
        run: |
          python dashboard/build_dashboard.py
          git diff --exit-code dashboard/population_health_and_cost.lvdash.json

  validate:
    name: Validate bundle
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod

  deploy:
    name: Deploy to prod
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
