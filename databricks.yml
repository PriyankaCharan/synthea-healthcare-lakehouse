# Databricks Asset Bundle for the Synthea healthcare lakehouse.
# One command deploys the notebooks, the medallion job and the AI/BI dashboard:
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run medallion_pipeline -t dev
# The workspace URL is not stored here: locally it comes from your CLI login
# (databricks auth login), in CI from the DATABRICKS_HOST secret.
bundle:
  name: synthea-healthcare-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze, silver and gold schemas
    default: workspace
  source_path:
    description: S3 folder with the raw Synthea CSV files
    default: s3://priyanka-synthea-healthcare/synthea/raw/seed42_p50000/
  warehouse_id:
    description: SQL warehouse used by the dashboard
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  # Personal sandbox. Resources get a "[dev <user>]" prefix and schedules stay paused.
  dev:
    mode: development
    default: true

  # The version deployed from GitHub Actions on every push to main.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
