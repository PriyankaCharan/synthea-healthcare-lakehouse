resources:
  jobs:
    medallion_pipeline:
      name: synthea-medallion-pipeline
      description: Bronze (S3 CSV) -> Silver (clean, de-identified, DQ checked) -> Gold (star schema and KPI marts)
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"   # Mondays 06:00
        timezone_id: Asia/Kolkata
        pause_status: PAUSED                      # turn on in the UI when you want weekly refreshes
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              source_path: ${var.source_path}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold_model.sql
