resources:
  apps:
    sql_agent:
      name: health-sql-agent
      description: Chat with the Synthea Gold layer. A Databricks-hosted model writes read-only SQL, the app runs it and explains the result.
      # The app needs the shared agent/ package, so it is deployed from the bundle root.
      source_code_path: ..
      config:
        command: ["streamlit", "run", "app/app.py", "--server.headless", "true"]
        env:
          - name: SERVING_ENDPOINT
            value_from: serving-endpoint
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: AGENT_CATALOG
            value: ${var.catalog}
      # Least privilege: the app's service principal can query the model, use the
      # warehouse and SELECT from the Gold tables only (no Bronze/Silver, no writes).
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.agent_endpoint}
            permission: CAN_QUERY
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: gold-dim-date
          uc_securable:
            securable_full_name: ${var.catalog}.gold.dim_date
            securable_type: TABLE
            permission: SELECT
        - name: gold-dim-patient
          uc_securable:
            securable_full_name: ${var.catalog}.gold.dim_patient
            securable_type: TABLE
            permission: SELECT
        - name: gold-dim-provider
          uc_securable:
            securable_full_name: ${var.catalog}.gold.dim_provider
            securable_type: TABLE
            permission: SELECT
        - name: gold-dim-organization
          uc_securable:
            securable_full_name: ${var.catalog}.gold.dim_organization
            securable_type: TABLE
            permission: SELECT
        - name: gold-dim-payer
          uc_securable:
            securable_full_name: ${var.catalog}.gold.dim_payer
            securable_type: TABLE
            permission: SELECT
        - name: gold-fact-encounter
          uc_securable:
            securable_full_name: ${var.catalog}.gold.fact_encounter
